version: 2.1

parameters:
  macos_version:
    type: string
    default: "13.5"
    description: "macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)"
  kernel_config:
    type: string
    default: "DEVELOPMENT"
    description: "RELEASE / DEVELOPMENT / DEBUG"
  machine_config:
    type: string
    default: "SWEET"
    description: "xnu MACHINE_CONFIG"
  keep_going:
    type: boolean
    default: true
    description: "make -k (collect all compile errors in one run)"
  use_ccache:
    type: boolean
    default: true
    description: "compile through ccache"

jobs:
  build:
    macos:
      # Xcode 15.4.0 matches the xnu-8796 IORPC ABI (Xcode 16 iig breaks compatibility)
      xcode: "15.4.0"
    # m4pro.medium (or macos.m1.medium.gen1 depending on account settings)
    resource_class: m4pro.medium
    environment:
      DXB_REPO: "https://github.com/blacktop/darwin-xnu-build"
      DXB_SHA: "663906528d1cd5ea8fde7de6f16de73db9511549"
      MACOS_VERSION: "<< pipeline.parameters.macos_version >>"
      KERNEL_CONFIG: "<< pipeline.parameters.kernel_config >>"
      MACHINE_CONFIG: "<< pipeline.parameters.machine_config >>"
      USE_CCACHE: "<< pipeline.parameters.use_ccache >>"
      CCACHE_DIR: "/Users/distiller/project/.ccache"
      CCACHE_BASEDIR: "/Users/distiller/project"
      CCACHE_NODIRECT: "1"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_MAXSIZE: "1G"
    steps:
      - checkout

      - name: Fetch build script and apply Sweet patches
        command: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Install dependencies and configure toolchain
        command: |
          brew install jq gum bash cmake ninja ccache
          # build.sh checks that xcodes binary exists; provide a stub since Xcode is preinstalled
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          xcodebuild -version
          xcrun --find iig

      - restore_cache:
          name: Restore ccache
          keys:
            - ccache-{{ .Branch }}-<< pipeline.parameters.macos_version >>-<< pipeline.parameters.machine_config >>-<< pipeline.parameters.kernel_config >>-{{ .Revision }}
            - ccache-{{ .Branch }}-<< pipeline.parameters.macos_version >>-<< pipeline.parameters.machine_config >>-<< pipeline.parameters.kernel_config >>-
            - ccache-{{ .Branch }}-

      - name: Build XNU kernel
        command: |
          cd dxb
          if [ "$USE_CCACHE" = "true" ]; then
            export CCACHE="$(command -v ccache)"
            ccache --version | head -1
            ccache --zero-stats
          fi
          if [ "<< pipeline.parameters.keep_going >>" = "true" ]; then
            export MAKEFLAGS="-k"
          else
            export MAKEFLAGS=""
          fi
          bash build.sh

      - name: ccache statistics
        command: |
          if [ "$USE_CCACHE" = "true" ]; then
            ccache --show-stats
          fi
        when: always

      - save_cache:
          name: Save ccache
          key: ccache-{{ .Branch }}-<< pipeline.parameters.macos_version >>-<< pipeline.parameters.machine_config >>-<< pipeline.parameters.kernel_config >>-{{ .Revision }}
          paths:
            - .ccache
          when: always

      - name: Package build tree for local compiles
        command: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz
        when: always

      - name: Collect kernel binaries and checksums
        command: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
        when: always

      - store_artifacts:
          path: out
          destination: xnu-kernel

      - store_artifacts:
          path: buildtree.tgz
          destination: xnu-buildtree

workflows:
  build-kernel:
    jobs:
      - build
